<div class="card">
  <h2>Créer un prêt</h2>

  <div class="row" *ngIf="error">
    <div class="error">{{ error }}</div>
  </div>

  <div class="row">
    <label>Montant du prêt (EUR)</label>
    <input type="number" [(ngModel)]="amount" name="amount" min="0" step="0.01" />
  </div>

  <div class="row">
    <label>Ratio minimal de garantie (ex. 1,5 = 150 %)</label>
    <input type="number" [(ngModel)]="liquidationRatio" name="ratio" min="1" step="0.01" />
  </div>

  <div class="row">
    <label>Crypto en garantie (CoinGecko id)</label>
    <input type="text" [(ngModel)]="collateralCryptoType" name="cryptoType" placeholder="bitcoin" />
  </div>

  <div class="row">
    <label>Quantité déposée</label>
    <input type="number" [(ngModel)]="collateralCryptoAmount" name="cryptoAmount" min="0" step="0.00000001" />
  </div>

  <button (click)="submitLoan()" [disabled]="isSubmitting">{{ isSubmitting ? 'Création...' : 'Créer' }}</button>
</div>
