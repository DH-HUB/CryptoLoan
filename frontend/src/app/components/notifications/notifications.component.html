<section class="max-w-5xl mx-auto p-6">
  <div class="flex items-center justify-between mb-6">
    <div><h2 class="text-2xl font-bold">Centre de notifications</h2><p class="text-gray-600">Alertes de contrat, de garantie et de liquidation.</p></div>
    <button class="bg-black text-white rounded px-4 py-2" (click)="sendTest()">Envoyer un e-mail test</button>
  </div>
  <p *ngIf="feedback" class="mb-4 rounded bg-yellow-100 p-3">{{ feedback }}</p>
  <p *ngIf="loading">Chargement…</p>
  <div class="space-y-3" *ngIf="!loading">
    <article *ngFor="let n of notifications" class="rounded-lg border bg-white p-4 shadow-sm">
      <div class="flex justify-between gap-4"><strong>{{ n.subject }}</strong><time class="text-sm text-gray-500">{{ n.createdAt | date:'short' }}</time></div>
      <p class="mt-2">{{ n.message }}</p>
      <span class="mt-2 inline-block text-xs rounded px-2 py-1" [class.bg-green-100]="n.status === 'SENT'" [class.bg-red-100]="n.status === 'FAILED'">E-mail : {{ n.status }}</span>
    </article>
    <p *ngIf="!notifications.length" class="text-gray-500">Aucune notification pour le moment.</p>
  </div>
</section>
