limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  root /usr/share/nginx/html;
  index index.html;

  location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/auth/ { proxy_pass http://backend:8080; proxy_set_header Host $host; limit_req zone=auth_limit burst=5 nodelay; }
  location /api/alerts/ { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; }
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
